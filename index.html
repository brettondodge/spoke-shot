<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Spoke Shot</title>
<meta name="description" content="Tap to fire spokes into a spinning hub without hitting another one. The levels never run out.">
<meta name="theme-color" content="#F1F8FC">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spoke Shot">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/bagel-fat-one-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/atkinson-hyperlegible-700.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Fonts ship with the game (SIL Open Font License, see fonts/), so it works offline. */
@font-face{font-family:"Bagel Fat One";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/bagel-fat-one-400.woff2") format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/atkinson-hyperlegible-400.woff2") format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:700;font-display:swap;src:url("fonts/atkinson-hyperlegible-700.woff2") format("woff2")}

/* Layout: one full-height stage. Level strip on top, hub spinning in the upper half, launcher at the bottom, result cards rise over the launcher. Every 10 levels a new "world" swaps these tokens from script. */
:root{
  --bg:#CFE8F3;
  --bg2:#F1F8FC;
  --ink:#1F2D4D;
  --muted:#51607E;
  --hub:#E8453C;
  --hub-ink:#FFF4D2;
  --accent:#F6B930;
  --card:#FFFFFF;
  --danger:#D93A3A;
  --font-display:"Bagel Fat One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --font-ui:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;overflow:hidden;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{touch-action:manipulation}
body{
  height:100%;margin:0;overflow:hidden;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--bg);
  background-image:linear-gradient(180deg,var(--bg2) 0%,var(--bg) 78%);
  color:var(--ink);font-family:var(--font-ui);font-size:14px;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none;
}
#stage{position:relative;height:100%}
/* The canvas covers the whole screen and paints its own background; the game is laid out inside #stage. */
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

.hud{position:absolute;top:0;left:0;right:0;height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px;pointer-events:none}
.hud>*{pointer-events:auto}
.lvl{display:flex;flex-direction:column;gap:4px;min-width:0}
.lvl-top{display:flex;align-items:center;gap:8px}
.lvl-num{font-family:var(--font-display);font-size:26px;line-height:1;letter-spacing:.01em}
.mode-tag{font-size:11px;font-weight:700;line-height:1;letter-spacing:.12em;text-transform:uppercase;padding:4px 8px;border-radius:999px;background:var(--hub);color:var(--hub-ink)}
.lvl-world{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-btns{display:flex;gap:8px;flex:none}
.icon-btn{width:44px;height:44px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;color:var(--ink);background:var(--card);background:color-mix(in srgb,var(--card) 70%,transparent);cursor:pointer}
#soundBtn[aria-pressed="true"] .snd-on{display:none}
#soundBtn:not([aria-pressed="true"]) .snd-off{display:none}

.toast{position:absolute;left:0;right:0;margin:0;text-align:center;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);opacity:0;transition:opacity .35s;pointer-events:none}
.toast.show{opacity:1}

.card{
  position:absolute;left:0;right:0;bottom:16px;margin-inline:auto;width:min(380px,100%);box-sizing:border-box;
  display:flex;flex-direction:column;gap:10px;padding:20px 20px 18px;border-radius:24px;
  background:var(--card);color:var(--ink);
  box-shadow:0 20px 44px -20px color-mix(in srgb,var(--ink) 60%,transparent),0 2px 0 color-mix(in srgb,var(--ink) 10%,transparent);
  max-height:calc(100% - 32px);overflow-y:auto;overscroll-behavior:contain;
}
.card.rise{animation:rise .34s cubic-bezier(.2,.9,.3,1.15)}
@keyframes rise{from{transform:translateY(18px);opacity:.55}to{transform:none;opacity:1}}
.eyebrow{margin:0;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--hub)}
.card-title{margin:0;font-family:var(--font-display);font-weight:400;font-size:34px;line-height:1.02;text-wrap:balance}
.card[data-kind="title"] .card-title{font-size:clamp(44px,13vw,58px)}
.card-body{margin:0;font-size:15.5px;line-height:1.45;color:var(--muted);max-width:42ch}
.save-note{margin:0;font-size:12.5px;line-height:1.4;color:var(--muted)}
.save-note.warn{color:var(--danger);font-weight:700}
.card-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.btn{flex:1 1 140px;min-height:52px;padding:0 18px;border-radius:999px;font:700 17px/1 var(--font-ui);cursor:pointer}
.btn.primary{border:0;background:var(--hub);color:var(--hub-ink);box-shadow:0 3px 0 color-mix(in srgb,var(--hub) 62%,#000)}
.btn.primary:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--hub) 62%,#000)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid color-mix(in srgb,var(--ink) 24%,transparent)}

.diff{display:flex;gap:4px;padding:4px;border-radius:16px;background:color-mix(in srgb,var(--ink) 8%,transparent)}
.diff-opt{flex:1;min-height:48px;padding:6px 10px;border:0;border-radius:12px;background:transparent;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.diff-opt[aria-checked="true"],.diff-opt[aria-selected="true"]{background:var(--ink);color:var(--card)}
.diff-name{font:700 15px/1.1 var(--font-ui)}
.diff-lvl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.stepper{display:flex;align-items:center;gap:6px;margin-top:2px}
.step{flex:none;width:48px;height:48px;border-radius:14px;border:0;background:color-mix(in srgb,var(--ink) 9%,transparent);color:var(--ink);font:700 16px/1 var(--font-ui);cursor:pointer}
.step:disabled{opacity:.35;cursor:default}
.pick{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.pick output{font-family:var(--font-display);font-size:42px;line-height:1;font-variant-numeric:tabular-nums}
.pick span{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.card-links{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px}
.link-btn{background:none;border:0;padding:6px 0;color:var(--muted);font:700 13px/1.2 var(--font-ui);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.link-btn.armed{color:var(--danger)}

.install-tip{margin:0;display:flex;align-items:flex-start;gap:8px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--accent) 24%,var(--card));color:var(--ink);font-size:13.5px;line-height:1.4}
.install-tip span{flex:1;min-width:0}
.tip-close{flex:none;width:32px;height:32px;margin:-6px -8px -6px 0;border:0;border-radius:50%;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer}

.code-box{display:flex;flex-direction:column;gap:8px}
.code-row{display:flex;gap:8px;align-items:stretch}
.code{flex:1;min-width:0;min-height:52px;display:flex;align-items:center;justify-content:center;padding:0 12px;border-radius:12px;background:color-mix(in srgb,var(--ink) 8%,transparent);font:700 22px/1.1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.08em;text-align:center;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.code-label{margin-top:6px;font-size:13px;font-weight:700;color:var(--muted)}
.code-in{flex:1;min-width:0;min-height:48px;box-sizing:border-box;padding:0 12px;border-radius:12px;border:2px solid color-mix(in srgb,var(--ink) 24%,transparent);background:var(--card);color:var(--ink);font:700 17px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.06em;text-transform:uppercase;-webkit-user-select:text;user-select:text}
.code-in::placeholder{font:400 15px/1 var(--font-ui);letter-spacing:0;text-transform:none;color:var(--muted)}
.code-in:focus-visible{outline:3px solid var(--ink);outline-offset:1px}
.btn-small{flex:none;min-height:48px;padding:0 16px;border-radius:12px;border:0;background:var(--ink);color:var(--card);font:700 15px/1 var(--font-ui);cursor:pointer}
.code-msg{margin:0;min-height:1.4em;font-size:13.5px;line-height:1.4;color:var(--muted)}
.code-msg.warn{color:var(--danger);font-weight:700}

.card.with-board[data-kind="title"] .card-title{font-size:clamp(36px,10vw,46px)}
.board{display:flex;flex-direction:column;gap:6px;padding:10px 10px 8px;border-radius:14px;background:color-mix(in srgb,var(--ink) 6%,transparent)}
.board-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px}
.board-title{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.board-head .link-btn{padding:2px 0}
.board-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.board-row{display:grid;grid-template-columns:2em minmax(0,1fr) auto;align-items:center;gap:8px;min-height:30px;padding:0 8px;border-radius:9px;font-size:15px}
.board-row.me{background:color-mix(in srgb,var(--hub) 20%,var(--card))}
.board-rank{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.board-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.board-name small{font-size:12.5px;font-weight:400;color:var(--muted)}
.board-lvl{font-family:var(--font-display);font-size:17px;font-variant-numeric:tabular-nums}
.board-gap{text-align:center;color:var(--muted);font-size:13px;line-height:1}
.board-empty{padding:4px 8px;color:var(--muted);font-size:14px;line-height:1.4}
.board-status{margin:0;padding:0 4px;font-size:12.5px;line-height:1.4;color:var(--muted)}
.board-status.warn{color:var(--danger);font-weight:700}
.board-join{align-self:flex-start;min-height:40px;margin:2px 0 2px 4px}
.board-full{display:flex;flex-direction:column;gap:8px}
.name-in{min-height:48px;box-sizing:border-box;padding:0 12px;border-radius:12px;border:2px solid color-mix(in srgb,var(--ink) 24%,transparent);background:var(--card);color:var(--ink);font:700 17px/1 var(--font-ui);-webkit-user-select:text;user-select:text}
.name-in::placeholder{font-weight:400;color:var(--muted)}
.name-in:focus-visible{outline:3px solid var(--ink);outline-offset:1px}
.join-box{display:flex;flex-direction:column;gap:8px}
.admin-list{display:flex;flex-direction:column;gap:4px}
.admin-row{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:6px 12px;border:0;border-radius:12px;background:color-mix(in srgb,var(--ink) 7%,transparent);color:var(--ink);font:700 15px/1.2 var(--font-ui);text-align:left;cursor:pointer}
.admin-row span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.admin-row small{flex:none;font-size:13px;font-weight:400;color:var(--muted)}
.admin-levels{display:flex;gap:8px}
.admin-field{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.admin-field .name-in{width:100%}
.link-btn.admin-erase{align-self:flex-start;color:var(--danger)}

button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;margin:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: reduce){.card.rise{animation:none}.toast{transition:none}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" role="img" aria-label="A spinning hub with spokes stuck in it"></canvas>

  <header class="hud">
    <div class="lvl" id="lvlBox">
      <span class="lvl-top"><span class="lvl-num" id="lvlNum">Level 1</span><span class="mode-tag" id="modeTag" hidden>Hard</span></span>
      <span class="lvl-world" id="lvlWorld">Daybreak · 1 of 10</span>
    </div>
    <div class="hud-btns">
      <button class="icon-btn" id="soundBtn" type="button" aria-label="Mute sound" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/>
          <path class="snd-on" d="M15.5 9a4.2 4.2 0 0 1 0 6M18.2 6.5a8 8 0 0 1 0 11"/>
          <path class="snd-off" d="M16 9.5l5 5M21 9.5l-5 5"/>
        </svg>
      </button>
      <button class="icon-btn" id="menuBtn" type="button" aria-label="Levels">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.2"/>
          <path d="M12 3.5v6.3M12 14.2v6.3M3.5 12h6.3M14.2 12h6.3"/>
        </svg>
      </button>
    </div>
  </header>

  <p class="toast" id="toast" aria-hidden="true"></p>

  <section class="card" id="card" data-kind="title" aria-labelledby="cardTitle">
    <p class="eyebrow" id="cardEyebrow">Tap to fire · Don’t touch</p>
    <h1 class="card-title" id="cardTitle">Spoke Shot</h1>
    <p class="card-body" id="cardBody">Fire every spoke into the spinning hub without hitting another one. Clear a wheel to unlock the next. The levels never run out.</p>
    <p class="install-tip" id="installTip" hidden>
      <span id="installText"></span>
      <button type="button" class="tip-close" id="installClose" aria-label="Hide this tip">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </p>
    <p class="save-note" id="saveNote" hidden></p>
    <div class="diff" id="diffPick" role="radiogroup" aria-label="Difficulty" hidden>
      <button type="button" class="diff-opt" data-mode="normal" role="radio" aria-checked="true"><span class="diff-name">Normal</span><span class="diff-lvl" id="diffLvlNormal">Level 1</span></button>
      <button type="button" class="diff-opt" data-mode="hard" role="radio" aria-checked="false"><span class="diff-name">Hard</span><span class="diff-lvl" id="diffLvlHard">Level 1</span></button>
    </div>
    <section class="board" id="boardPanel" aria-label="Leaderboard" hidden>
      <div class="board-head">
        <span class="board-title" id="boardTitle">Leaderboard</span>
        <button type="button" class="link-btn" id="boardAll">See all</button>
      </div>
      <ol class="board-list" id="boardList"></ol>
      <p class="board-status" id="boardStatus" aria-live="polite"></p>
      <button type="button" class="btn-small board-join" id="boardJoin">Join the leaderboard</button>
    </section>
    <div class="stepper" id="stepper" hidden>
      <button class="step" type="button" data-step="-10" aria-label="Back 10 levels">−10</button>
      <button class="step" type="button" data-step="-1" aria-label="Back 1 level">−1</button>
      <div class="pick"><output id="pickOut" aria-live="polite">1</output><span id="pickWorld">Daybreak</span></div>
      <button class="step" type="button" data-step="1" aria-label="Forward 1 level">+1</button>
      <button class="step" type="button" data-step="10" aria-label="Forward 10 levels">+10</button>
    </div>
    <div class="code-box" id="codeBox" hidden>
      <div class="code-row">
        <output class="code" id="codeOut" aria-label="Your save code">----</output>
        <button type="button" class="btn-small" id="codeCopy">Copy</button>
      </div>
      <label class="code-label" for="codeIn">Have a code from another phone or browser?</label>
      <div class="code-row">
        <input class="code-in" id="codeIn" type="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" maxlength="40" placeholder="Enter a save code">
        <button type="button" class="btn-small" id="codeRestore">Restore</button>
      </div>
      <p class="code-msg" id="codeMsg" aria-live="polite"></p>
    </div>
    <div class="board-full" id="boardFull" hidden>
      <div class="diff" id="boardTabs" role="tablist" aria-label="Leaderboard difficulty">
        <button type="button" class="diff-opt" data-board="normal" role="tab" aria-selected="true"><span class="diff-name">Normal</span></button>
        <button type="button" class="diff-opt" data-board="hard" role="tab" aria-selected="false"><span class="diff-name">Hard</span></button>
      </div>
      <ol class="board-list" id="boardFullList"></ol>
      <p class="board-status" id="boardFullStatus" aria-live="polite"></p>
      <div class="card-links" id="boardMine">
        <button type="button" class="link-btn" id="boardRename">Change name</button>
        <button type="button" class="link-btn" id="boardLeave">Leave leaderboard</button>
      </div>
    </div>
    <div class="join-box" id="joinBox" hidden>
      <label class="code-label" for="nameIn">Your name</label>
      <input class="name-in" id="nameIn" type="text" autocomplete="nickname" autocorrect="off" spellcheck="false" maxlength="16" placeholder="A name or nickname">
      <p class="code-msg" id="joinMsg" aria-live="polite"></p>
    </div>
    <div class="join-box" id="adminLoginBox" hidden>
      <label class="code-label" for="adminUser">User</label>
      <input class="name-in" id="adminUser" type="text" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="100">
      <label class="code-label" for="adminPass">Password</label>
      <input class="name-in" id="adminPass" type="password" autocomplete="current-password" maxlength="200">
      <p class="code-msg" id="adminLoginMsg" aria-live="polite"></p>
    </div>
    <div class="board-full" id="adminBox" hidden>
      <div class="admin-list" id="adminList" role="list"></div>
      <p class="board-status" id="adminListMsg" aria-live="polite"></p>
    </div>
    <div class="join-box" id="adminEditBox" hidden>
      <label class="code-label" for="adminName">Name</label>
      <input class="name-in" id="adminName" type="text" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="16">
      <div class="admin-levels">
        <label class="admin-field" for="adminNormal"><span class="code-label">Normal level</span><input class="name-in" id="adminNormal" type="number" inputmode="numeric" min="1" step="1"></label>
        <label class="admin-field" for="adminHard"><span class="code-label">Hard level</span><input class="name-in" id="adminHard" type="number" inputmode="numeric" min="1" step="1"></label>
      </div>
      <button type="button" class="link-btn admin-erase" id="adminErase">Erase this player</button>
      <p class="code-msg" id="adminEditMsg" aria-live="polite"></p>
    </div>
    <div class="card-actions">
      <button class="btn primary" id="primaryBtn" type="button">Play level 1</button>
      <button class="btn ghost" id="secondaryBtn" type="button" hidden>Pick a level</button>
    </div>
    <div class="card-links" id="cardLinks" hidden>
      <button class="link-btn" id="boardBtn" type="button" hidden>Leaderboard</button>
      <button class="link-btn" id="codeBtn" type="button">Save code</button>
      <button class="link-btn" id="resetBtn" type="button">Reset progress</button>
    </div>
  </section>

  <p class="sr" id="sr" aria-live="polite"></p>
</div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const stage = $('stage'), cv = $('cv'), ctx = cv.getContext('2d', { alpha: false }); // opaque canvas: cheaper for the phone to show
  const card = $('card'), cardEyebrow = $('cardEyebrow'), cardTitle = $('cardTitle'), cardBody = $('cardBody');
  const stepper = $('stepper'), pickOut = $('pickOut'), pickWorld = $('pickWorld');
  const primaryBtn = $('primaryBtn'), secondaryBtn = $('secondaryBtn'), resetBtn = $('resetBtn');
  const soundBtn = $('soundBtn'), menuBtn = $('menuBtn'), toastEl = $('toast'), srEl = $('sr'), saveNote = $('saveNote');
  const modeTag = $('modeTag'), diffPick = $('diffPick'), diffLvl = { normal: $('diffLvlNormal'), hard: $('diffLvlHard') };
  const cardLinks = $('cardLinks'), codeBtn = $('codeBtn'), codeBox = $('codeBox'), codeOut = $('codeOut'), codeCopy = $('codeCopy');
  const codeIn = $('codeIn'), codeRestore = $('codeRestore'), codeMsg = $('codeMsg');
  const installTip = $('installTip'), installText = $('installText'), installClose = $('installClose');
  const boardPanel = $('boardPanel'), boardTitle = $('boardTitle'), boardAll = $('boardAll'), boardList = $('boardList');

  function bead(x, y, r, fill, label){

    const s = beadSprite(label, fill), h = s.half * (r / geo.br);
    ctx.drawImage(s.c, x - h, y - h, h * 2, h * 2);
  }
  function paintBackground(){
    if (!bgGrad){
      bgGrad = ctx.createLinearGradient(0, 0, 0, geo.VH);
      bgGrad.addColorStop(0, P.bg2); bgGrad.addColorStop(0.78, P.bg); bgGrad.addColorStop(1, P.bg);
    }
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, geo.VW, geo.VH);
  }
  // Sprites drawn before the fonts arrive would keep the fallback font, so redraw them once loaded.
  if (document.fonts && document.fonts.load){
    Promise.all([document.fonts.load('700 16px "Atkinson Hyperlegible"'), document.fonts.load('16px "Bagel Fat One"')])
      .then(() => { sprites.clear(); lastFont = ''; }).catch(() => {});
  }

  function draw(now){
    const { dpr, cx, cy, R, O, br, launchY } = geo;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    paintBackground();
    let sx = 0, sy = 0;
    if (game.shake > 0 && !reduced){
      const m = game.shake * game.shake * 9;
      sx = (Math.random() * 2 - 1) * m; sy = (Math.random() * 2 - 1) * m;
    }
    ctx.translate(geo.offX + sx, geo.offY + sy);
    const A = game.angle, hit = game.hit, L = game.L;
    ctx.lineCap = 'round';

    // spokes
    ctx.strokeStyle = P.ink; ctx.lineWidth = Math.max(1.5, br * 0.2);
    ctx.beginPath();
    for (const s of game.stuck){
      const c = Math.cos(s.a + A), sn = Math.sin(s.a + A);
      ctx.moveTo(cx + c * R * 0.8, cy + sn * R * 0.8);
      ctx.lineTo(cx + c * O, cy + sn * O);
    }
    ctx.stroke();

    // beads on the hub
    game.stuck.forEach((s, i) => {
      const th = s.a + A;
      let sc = 1;
      if (game.state === 'won' && !reduced){ const k = game.winT * 10 - i * 0.55; sc += 0.35 * Math.max(0, 1 - Math.abs(k - 1)); }
      if (s.born){ const age = (now - s.born) / 1000; if (age < 0.18) sc *= 1 + 0.3 * (1 - age / 0.18); }
      bead(cx + Math.cos(th) * O, cy + Math.sin(th) * O, br * sc, hit && hit.s === s ? P.danger : P.ink, s.label);
    });

    // hub
    const hr = R * (1 + game.bump * 0.05);
    disc(cx, cy, hr, P.hub);
    const ringR = hr * 0.8, ringW = Math.max(3, hr * 0.09);
    ctx.lineWidth = ringW; ctx.strokeStyle = P.hubInk;
    ctx.globalAlpha = 0.22; ctx.beginPath(); ctx.arc(cx, cy, ringR, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
    if (game.fired > 0){
      ctx.beginPath(); ctx.arc(cx, cy, ringR, -Math.PI / 2, -Math.PI / 2 + (Math.PI * 2 * game.fired) / L.fire); ctx.stroke();
    }
    if (game.state === 'won' || (game.state === 'menu' && menuFrom === 'won')){
      ctx.lineWidth = hr * 0.13; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(cx - hr * 0.3, cy + hr * 0.02); ctx.lineTo(cx - hr * 0.07, cy + hr * 0.25); ctx.lineTo(cx + hr * 0.32, cy - hr * 0.2); ctx.stroke();
    } else {
      ctx.fillStyle = P.hubInk; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      setFont(Math.round(R * (game.queue >= 10 ? 0.62 : 0.72)) + 'px ' + DISPLAY);
      ctx.fillText(String(game.queue), cx, cy + hr * 0.05);
    }

    // spokes in flight
    for (const f of game.flying){
      ctx.strokeStyle = P.ink; ctx.lineWidth = Math.max(1.5, br * 0.2); ctx.globalAlpha = 0.3;
      ctx.beginPath(); ctx.moveTo(cx, f.y + br * 1.1); ctx.lineTo(cx, f.y + br * 3.4); ctx.stroke();
      ctx.globalAlpha = 1;
      bead(cx, f.y, br, hit && hit.f === f ? P.danger : P.ink, f.label);
    }

    // launcher: the next few spokes, newest on top
    if (game.queue > 0){
      ctx.strokeStyle = P.ink; ctx.lineWidth = Math.max(1.5, br * 0.18); ctx.globalAlpha = 0.35;
      const ay = launchY - br * 2.1;
      ctx.beginPath(); ctx.moveTo(cx - br * 0.55, ay + br * 0.35); ctx.lineTo(cx, ay - br * 0.2); ctx.lineTo(cx + br * 0.55, ay + br * 0.35); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    const gap = br * 2.7;
    for (let i = Math.min(game.queue, 4) - 1; i >= 0; i--){
      ctx.globalAlpha = 1 - i * 0.22;
      bead(cx, launchY + i * gap, br * (1 - i * 0.05), P.ink, game.queue - i);
    }
    ctx.globalAlpha = 1;
  }

  // ---- Difficulty ------------------------------------------------------------

  // ---- Save codes ------------------------------------------------------------
  // A save code carries both difficulties' progress to another phone or browser.
  // Layout: 2 check characters, then the data, scrambled with a key made from the check value
  // so codes don't look like counting. Data: a version number, then for Normal and Hard
  // "furthest level - 1" and "furthest - current", each written 4 bits per character with the
  // 5th bit meaning "more characters follow". A typo fails the check almost every time.
  const B32 = '0123456789ABCDEFGHJKMNPQRSTVWXYZ'; // no I, L, O or U, so it's hard to misread
  const CODE_VERSION = 1;
  function codeCheck(digits){
    let h = 0x811C9DC5;
    for (const d of digits){ h ^= d; h = Math.imul(h, 0x01000193) >>> 0; }
    return (h ^ (h >>> 10) ^ (h >>> 20)) & 1023;
  }
  function codeKeys(check){ const r = mulberry32((Math.imul(check + 1, 2654435761) ^ 0x5A17C0DE) >>> 0); return () => Math.floor(r() * 32); }
  function encodeSave(p){
    const nums = [CODE_VERSION, p.normal.best - 1, p.normal.best - p.normal.level, p.hard.best - 1, p.hard.best - p.hard.level];
    const digits = [];
    for (let v of nums){
      v = Math.max(0, Math.floor(v));
      const chunk = [];
      do { chunk.push(v % 16); v = Math.floor(v / 16); } while (v > 0);
      for (let i = chunk.length - 1; i >= 0; i--) digits.push(chunk[i] | (i > 0 ? 16 : 0));
    }
    const check = codeCheck(digits), key = codeKeys(check);
    const raw = B32[check >> 5] + B32[check & 31] + digits.map((d) => B32[d ^ key()]).join('');
    return raw.match(/.{1,4}/g).join('-');
  }
  function decodeSave(text){
    const s = String(text || '').toUpperCase().replace(/[\s\-_.]/g, '').replace(/O/g, '0').replace(/[IL]/g, '1');
    if (s.length < 7 || s.length > 40) return null;
    const vals = [];
    for (const ch of s){ const v = B32.indexOf(ch); if (v < 0) return null; vals.push(v); }
    const check = (vals[0] << 5) | vals[1], key = codeKeys(check);
    const digits = vals.slice(2).map((v) => v ^ key());
    if (codeCheck(digits) !== check) return null;
    const nums = [];
    let v = 0, open = false;
    for (const d of digits){ v = v * 16 + (d & 15); open = (d & 16) !== 0; if (!open){ nums.push(v); v = 0; } }
    if (open || nums.length !== 5 || nums[0] !== CODE_VERSION) return null;
    const nb = nums[1] + 1, hb = nums[3] + 1;
    if (nb > 1e6 || hb > 1e6) return null;
    return { normal: { best: nb, level: clamp(nb - nums[2], 1, nb) }, hard: { best: hb, level: clamp(hb - nums[4], 1, hb) } };
  }
  // Takes a code's progress wherever it is further along; never moves anyone backward.
  function restoreCode(text){
    const d = decodeSave(text);
    if (!d) return { ok: false, msg: 'That code doesn’t look right. Check each character and try again.' };
    prog[mode] = { best, level: resumeLevel() };
    const gained = [];
    for (const m of MODES) if (d[m].best > prog[m].best){ prog[m] = d[m]; gained.push(DIFFS[m].label + ' level ' + d[m].level); }
    if (!gained.length) return { ok: true, msg: 'This phone is already as far as that code, so nothing changed.' };
    best = prog[mode].best;
    loadLevel(clamp(prog[mode].level, 1, best));
    menuFrom = 'title'; pick = game.level;
    save();
    return { ok: true, msg: 'Restored ' + gained.join(' and ') + '.' };
  }

  // ---- Home Screen tip -------------------------------------------------------
  // In a phone's browser tab, progress is easier to lose (Safari clears a site's data after
  // about a week away). The tip only shows there, never in the installed app or on claude.ai.
  const TIP_KEY = 'spoke-shot.tip-hidden';
  const ua = navigator.userAgent || '';
  const isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/.test(ua);
  const installed = navigator.standalone === true || !!(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  function tipWanted(){
    if (window.claude || installed || !(isIOS || isAndroid) || !/^https?:$/.test(location.protocol)) return false;
    try { return localStorage.getItem(TIP_KEY) !== '1'; } catch (e) { return true; }
  }
  installText.textContent = isIOS
    ? 'Keep your progress safe: add Spoke Shot to your Home Screen. Tap Share, then Add to Home Screen.'
    : 'Keep your progress safe: install Spoke Shot. Tap ⋮, then Add to Home screen.';

  // ---- Leaderboard -----------------------------------------------------------
  // Players who join (by picking a name) share their furthest level on Normal and Hard.
  // It talks to Firebase over plain web requests: anonymous sign-in gives each phone an id,
  // and the database rules only let a phone change its own entry. Offline, the menu shows the
  // last board it downloaded, and the phone's own entry waits until it's back online.
  const LB_KEY = 'spoke-shot.board';
  const LB_BASE = LEADERBOARD.databaseURL.replace(/\/+$/, '');
  const lb = {
    enabled: !!(LEADERBOARD.apiKey && LB_BASE) && !window.claude && typeof fetch === 'function',
    scores: {}, at: 0, lastTry: 0, loading: false, readError: '', busy: false, again: false, syncError: '', tab: 'normal', notice: '',
    me: { uid: '', refresh: '', idToken: '', idExp: 0, name: '', joined: false, sent: null, pendingDelete: false },
  };
  function cleanName(s){
    return String(s == null ? '' : s)
      .replace(/[\u0000-\u001f\u007f-\u009f\u200b-\u200f\u2028-\u202e\u2060-\u206f\ufeff]/g, '')
      .replace(/\s+/g, ' ').trim().slice(0, 16).replace(/[\ud800-\udbff]$/, '').trim();
  }
  function cleanScores(data){
    const out = {};
    if (!data || typeof data !== 'object') return out;
    for (const uid of Object.keys(data)){
      const s = data[uid], name = s && typeof s === 'object' ? cleanName(s.name) : '';
      if (!name) continue;
      out[uid] = { name, normal: Math.max(1, Math.floor(Number(s.normal)) || 1), hard: Math.max(1, Math.floor(Number(s.hard)) || 1), updated: Number(s.updated) || 0 };
    }
    return out;
  }
  function lbLoad(){
    try {
      const s = JSON.parse(localStorage.getItem(LB_KEY) || '{}') || {};
      const m = s.me || {}, name = cleanName(m.name);
      Object.assign(lb.me, { uid: String(m.uid || ''), refresh: String(m.refresh || ''), name, joined: !!m.joined && !!name,
        sent: m.sent && typeof m.sent === 'object' ? m.sent : null, pendingDelete: !!m.pendingDelete });
      lb.scores = cleanScores(s.scores); lb.at = Number(s.at) || 0;
    } catch (e) {}
  }
  function lbSave(){
    const m = lb.me;
    try { localStorage.setItem(LB_KEY, JSON.stringify({ me: { uid: m.uid, refresh: m.refresh, name: m.name, joined: m.joined, sent: m.sent, pendingDelete: m.pendingDelete }, scores: lb.scores, at: lb.at })); } catch (e) {}
  }
  async function lbFetch(url, opts){
    const ctl = typeof AbortController === 'function' ? new AbortController() : null;
    const timer = ctl ? setTimeout(() => ctl.abort(), 8000) : 0;
    try { return await fetch(url, Object.assign({ cache: 'no-store' }, opts || {}, ctl ? { signal: ctl.signal } : {})); }
    finally { clearTimeout(timer); }
  }
  const lbUrl = (path, token) => LB_BASE + '/' + path + '.json' + (token ? '?auth=' + encodeURIComponent(token) : '');
  const offlineNow = () => navigator.onLine === false;

  // A short-lived sign-in token for this phone's anonymous account, renewed as needed.
  async function lbToken(){
    const me = lb.me, key = encodeURIComponent(LEADERBOARD.apiKey);
    if (me.idToken && Date.now() < me.idExp - 60000) return me.idToken;
    let res, data;
    if (me.refresh){
      res = await lbFetch('https://securetoken.googleapis.com/v1/token?key=' + key, {
        method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(me.refresh),
      });
      if (res.ok){
        data = await res.json();
        Object.assign(me, { uid: data.user_id, refresh: data.refresh_token, idToken: data.id_token, idExp: Date.now() + Number(data.expires_in) * 1000 });
        lbSave();
        return me.idToken;
      }
      if (res.status !== 400) throw new Error('token ' + res.status); // 400: this phone's account is gone, so make a new one
    }
    res = await lbFetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=' + key, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{"returnSecureToken":true}',
    });
    if (!res.ok) throw new Error('sign-up ' + res.status);
    data = await res.json();
    if (me.uid && me.uid !== data.localId){ delete lb.scores[me.uid]; me.sent = null; me.pendingDelete = false; }
    Object.assign(me, { uid: data.localId, refresh: data.refreshToken, idToken: data.idToken, idExp: Date.now() + Number(data.expiresIn) * 1000 });
    lbSave();
    return me.idToken;
  }
  function lbEntry(){ const p = progress(); return { name: lb.me.name, normal: p.normal.best, hard: p.hard.best }; }
  function lbUnsent(){
    const m = lb.me;
    if (!m.joined) return m.pendingDelete;
    const e = lbEntry(), s = m.sent;
    return !s || s.name !== e.name || s.normal !== e.normal || s.hard !== e.hard;
  }
  // Sends this phone's entry (or removes it after leaving) when something changed. One at a time.
  async function lbSync(){
    if (!lb.enabled) return;
    if (lb.busy){ lb.again = true; return; }
    if (!lbUnsent()){ lb.syncError = ''; return; }
    lb.busy = true; renderBoards();
    try {
      const me = lb.me;
      if (me.pendingDelete && me.uid && !me.joined){
        const token = await lbToken();
        if (me.pendingDelete){ // still set unless the phone had to start a fresh account (nothing to remove then)
          const res = await lbFetch(lbUrl('scores/' + me.uid, token), { method: 'DELETE' });
          if (res.status === 401 || res.status === 403) me.idToken = '';
          if (!res.ok) throw new Error('delete ' + res.status);
          me.pendingDelete = false; delete lb.scores[me.uid]; lbSave();
        }
      }
      if (me.joined){
        const token = await lbToken();
        // If an admin changed or erased this entry since our last save, take that first
        // instead of overwriting it.
        if (me.sent && me.uid){
          const check = await lbFetch(lbUrl('scores/' + me.uid));
          if (check.ok) lbReconcile(cleanEntry(await check.json()), Date.now());
        }
        if (me.joined && lbUnsent()){
          const entry = lbEntry();
          const res = await lbFetch(lbUrl('scores/' + me.uid, token), {
            method: 'PUT', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: entry.name, normal: entry.normal, hard: entry.hard, updated: { '.sv': 'timestamp' } }),
          });
          if (res.status === 401 || res.status === 403) me.idToken = '';
          if (!res.ok) throw new Error('save ' + res.status);
          const saved = cleanEntry(await res.json().catch(() => null)); // the database answers with its own save time
          me.sent = { name: entry.name, normal: entry.normal, hard: entry.hard, updated: saved ? saved.updated : 0, at: Date.now() };
          me.pendingDelete = false;
          lb.scores[me.uid] = { name: entry.name, normal: entry.normal, hard: entry.hard, updated: saved ? saved.updated : Date.now() };
          lbSave();
        }
      }
      lb.syncError = '';
    } catch (e) {
      lb.syncError = offlineNow() || (e && (e.name === 'TypeError' || e.name === 'AbortError')) ? 'offline' : 'error';
    } finally {

      return;
    }
    if ((e.key === ' ' || e.key === 'ArrowUp') && game.state === 'play'){
      e.preventDefault();
      if (!e.repeat){ unlockAudio(); fire(); }
    }
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden && game.state === 'play') openMenu(); });

  // ---- Boot ----------------------------------------------------------------
  let last = 0;
  function frame(now){
    const dt = last ? Math.min(0.05, (now - last) / 1000) : 0;
    last = now;
    update(dt);
    draw(now);
    requestAnimationFrame(frame);
  }
  function start(){
    saver.local = probeLocal();
    const s = readProgress(loadLocal());
    saver.hadLocal = !!s;
    if (s){ mode = s.mode; muted = s.muted; prog.normal = s.normal; prog.hard = s.hard; } // new players start on Normal
    soundBtn.setAttribute('aria-pressed', String(muted));
    best = prog[mode].best;
    loadLevel(clamp(prog[mode].level, 1, best));
    game.state = 'title';
    lbStart();
    layout();
    showCard('title');
    if (window.ResizeObserver) new ResizeObserver(layout).observe(stage);
    window.addEventListener('resize', layout);
    requestAnimationFrame(frame);
    connectCloud();
  }
  start();

  // Offline support: once the game has loaded from a web address, sw.js keeps a copy on the device,
  // and the browser is asked not to clear saved progress when space runs low.
  // (Skipped inside claude.ai, and when index.html is opened straight from a folder.)
  if (!window.claude && /^https?:$/.test(location.protocol)){
    if ('serviceWorker' in navigator){
      window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
      // When a new version finishes downloading, switch to it right away if nobody is mid-level.
      const hadWorker = !!navigator.serviceWorker.controller;
      let reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!hadWorker || reloading || game.state !== 'title') return;
        reloading = true;
        location.reload();
      });
    }
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  }
})();
</script>
</body>
</html>
